[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — without this, any deep link (e.g. /app after Google
# sign-in, or a direct visit to /admin/report) 404s, because Netlify
# looks for a matching static file/folder instead of letting the
# client-side router handle it.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
